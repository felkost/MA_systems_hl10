# Self-hosted Langfuse v3 stack. Written at stage 0 so .env.example and this
# file agree from the start; first started at stage 9.
#
# Memory is pinned per container (as hl8 pinned Neo4j under the WSL cap):
# the whole stack must fit next to four Python processes on a dev machine.
# All secrets come from .env -- validate the rendered file with
# `docker compose config` before the first start.

services:
  langfuse-web:
    image: langfuse/langfuse:3
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    environment: &langfuse-env
      DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost:3000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      # This ClickHouse is one standalone node with no Keeper/ZooKeeper --
      # without this, entrypoint.sh's up.sh defaults to the *clustered*
      # migration path (ReplicatedMergeTree ON CLUSTER default), which
      # fails outright with "no Zookeeper configuration" on a single node.
      # "false" selects clickhouse/migrations/unclustered (plain MergeTree).
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      # Batch exports (the UI's "download as CSV/JSON") are a *separate*
      # bucket configuration from the event upload above -- with only the
      # event-upload block set, every export job fails with a bare "An
      # internal error occurred" (measured at stage 10a, three attempts).
      # Same bucket, distinct prefix, so the minio entrypoint below needs
      # no second `mkdir`.
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "true"
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: batch-exports/
      LANGFUSE_S3_BATCH_EXPORT_REGION: auto
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: minio
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://minio:9000
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
      # The one non-obvious line. The finished export is handed to the
      # *browser* as a presigned URL, and the browser is not inside the
      # compose network -- signed against `http://minio:9000` it resolves
      # nowhere and the download fails even though the job succeeded. This
      # is why the minio service below also gains a host port binding.
      LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: http://localhost:9090
      TELEMETRY_ENABLED: "false"
    # 768m OOM'd at idle startup; 1536m OOM'd a second time under the
    # actual span-ingestion burst from one real REPL question with two
    # REVISE rounds (both measured live, both "JavaScript heap out of
    # memory", OOMKilled=false -- Node's own heap ceiling, not the cgroup
    # limit killing the process outright). Raised again -- needs WSL2's own
    # cap raised to 6GB (from 4GB) to fit alongside the other five limits.
    mem_limit: 3072m
    restart: "no"

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment: *langfuse-env
    # Same Node/Prisma/ClickHouse-client stack as langfuse-web (above) --
    # raised in the same commit rather than waiting for it to OOM too.
    mem_limit: 768m
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - langfuse-postgres:/var/lib/postgresql/data
    mem_limit: 256m
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: default
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user clickhouse --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    mem_limit: 1g
    restart: "no"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_AUTH}
    mem_limit: 128m
    restart: "no"

  minio:
    image: minio/minio:latest
    entrypoint: sh
    # Create the bucket the worker expects, then serve.
    command: -c 'mkdir -p /data/langfuse && minio server /data'
    # Loopback only, per the project's no-0.0.0.0 rule. Present solely so a
    # presigned batch-export URL handed to the browser resolves.
    ports:
      - "127.0.0.1:9090:9000"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - langfuse-minio:/data
    mem_limit: 256m
    restart: "no"

volumes:
  langfuse-postgres:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio:
