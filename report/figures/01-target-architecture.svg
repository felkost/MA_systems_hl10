      <text x="868" y="228" fill="rgba(45,49,66,0.40)" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP SERVERS</text>

      <!-- Arrows (before nodes, so z-order puts them behind) -->
      <line x1="208" y1="280" x2="272" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

