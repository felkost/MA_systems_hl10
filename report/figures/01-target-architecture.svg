<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 792" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="target-architecture-title target-architecture-desc">
      <title id="target-architecture-title">Target architecture of MA_systems_hl10</title>
      <desc id="target-architecture-desc">A local terminal process holds the REPL and the Supervisor agent; the Supervisor delegates over A2A to a Planner, a Researcher and a Critic, each running as its own server on its own port with its own Agent Card, and each calling a shared SearchMCP tool server; the Critic returns a verdict as a structured data part; and the single write to disk goes through a ReportMCP server only after a human approves it.</desc>
      <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Editorial aside -->
      <line x1="40" y1="56" x2="120" y2="56" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="40" y="88" fill="#2d3142" font-size="16" font-family="'Instrument Serif', serif" font-style="italic">Every hop crosses a protocol. In A2A one server is one agent, so each</text>
      <text x="40" y="112" fill="#2d3142" font-size="16" font-family="'Instrument Serif', serif" font-style="italic">sub-agent gets its own port and its own Agent Card.</text>

