      <rect x="64" y="216" width="104" height="16" rx="2" fill="#f5f5f5"/>
      <text x="116" y="228" fill="rgba(45,49,66,0.40)" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOCAL PROCESS</text>

      <rect x="520" y="124" width="216" height="300" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="536" y="128" width="136" height="16" rx="2" fill="#f5f5f5"/>
      <text x="604" y="140" fill="rgba(45,49,66,0.40)" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">A2A AGENT SERVERS</text>

